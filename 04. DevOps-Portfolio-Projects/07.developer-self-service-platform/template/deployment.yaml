apiVersion: apps/v1
kind: Deployment
metadata:
  name: @@NAME@@
  labels: {team: @@TEAM@@}
spec:
  replicas: 2
  selector:
    matchLabels: {app: @@NAME@@}
  template:
    metadata:
      labels: {app: @@NAME@@, team: @@TEAM@@}
    spec:
      containers:
        - name: service
          image: @@NAME@@:lab
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: @@NAME@@}
spec:
  selector: {app: @@NAME@@}
  ports: [{port: 80, targetPort: 8080}]
