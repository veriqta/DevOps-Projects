name: devops-jobs
services:
  gateway:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
  api:
    build: .
    volumes: ["jobs:/data"]
    mem_limit: 128m
    cpus: 0.5
  worker:
    build: .
    command: ["python", "app.py", "worker"]
    volumes: ["jobs:/data"]
    mem_limit: 128m
    cpus: 0.5
volumes:
  jobs: {}
